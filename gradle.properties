# The build machine has a tight commit limit (no page file), so the daemon is
# kept deliberately small and uses SerialGC, which reserves far less native
# memory than G1. Raise these on a normal development machine if you like.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.vfs.watch=false

# Fabric Properties
#   check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
version=1.0.0
group=com.comfortable
archives_base_name=nearby-mob

# Dependencies
fabric_api_version=0.141.6+1.21.11
cloth_config_version=21.11.160
modmenu_version=17.0.1
